{% extends "base.html" %}
{% block title %}Evaluar Aplicativo{% endblock %}
{% block content %}
<h2>Evaluar Aplicativo</h2>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Aplicativo</label>
    <select class="form-select" name="id_aplicativo" required>
      <option value="">-- Seleccione --</option>
      {% for a in aplicativos %}
        <option value="{{ a['id_aplicativo'] }}">{{ a['nombre'] }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Normas (0-100)</label>
      <input class="form-control" type="number" name="normas" min="0" max="100" required>
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Modelos (0-100)</label>
      <input class="form-control" type="number" name="modelos" min="0" max="100" required>
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Estándares (0-100)</label>
      <input class="form-control" type="number" name="estandares" min="0" max="100" required>
    </div>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Código (0-100)</label>
      <input class="form-control" type="number" name="codigo" min="0" max="100" required>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Pruebas (0-100)</label>
      <input class="form-control" type="number" name="pruebas" min="0" max="100" required>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Evaluador (nombre)</label>
    <input class="form-control" name="evaluador">
  </div>
  <div class="mb-3">
    <label class="form-label">Comentarios</label>
    <textarea class="form-control" name="comentarios"></textarea>
  </div>
  <button class="btn btn-primary">Calcular y Guardar</button>
</form>
{% endblock %}
