{% extends "base.html" %}
{% block title %}Aplicativos{% endblock %}
{% block content %}
<h2>Aplicativos</h2>
<a class="btn btn-success mb-3" href="{{ url_for('aplicativo_create') }}">Crear nuevo aplicativo</a>
<table class="table table-striped">
  <thead><tr><th>Nombre</th><th>Autor</th><th>Link</th><th>Acciones</th></tr></thead>
  <tbody>
    {% for a in aplicativos %}
      <tr>
        <td>{{ a['nombre'] }}</td>
        <td>{{ a['autor'] }}</td>
        <td><a href="{{ a['link_publico'] }}" target="_blank">{{ a['link_publico'] }}</a></td>
        <td>
          <a class="btn btn-sm btn-primary" href="{{ url_for('aplicativo_edit', id=a['id_aplicativo']) }}">Editar</a>
          <form action="{{ url_for('aplicativo_delete', id=a['id_aplicativo']) }}" method="post" style="display:inline" onsubmit="return confirm('Eliminar?');">
            <button class="btn btn-sm btn-danger">Eliminar</button>
          </form>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
