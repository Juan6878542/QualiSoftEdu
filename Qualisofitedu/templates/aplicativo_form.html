{% extends "base.html" %}
{% block title %}Aplicativo{% endblock %}
{% block content %}
<h2>{% if aplicativo %}Editar Aplicativo{% else %}Nuevo Aplicativo{% endif %}</h2>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input class="form-control" name="nombre" value="{{ aplicativo['nombre'] if aplicativo else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Descripción</label>
    <textarea class="form-control" name="descripcion">{{ aplicativo['descripcion'] if aplicativo else '' }}</textarea>
  </div>
  <div class="mb-3">
    <label class="form-label">Autor</label>
    <input class="form-control" name="autor" value="{{ aplicativo['autor'] if aplicativo else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Link público</label>
    <input class="form-control" name="link_publico" value="{{ aplicativo['link_publico'] if aplicativo else '' }}">
  </div>
  <button class="btn btn-primary">Guardar</button>
  <a class="btn btn-secondary" href="{{ url_for('aplicativos') }}">Cancelar</a>
</form>
{% endblock %}
